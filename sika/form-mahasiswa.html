<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>SIKA - Form Mahasiswa</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>SIKA</h1>
            <p>Sistem Informasi Akademik</p>
        </div>
    </header>

    <nav aria-label="Navigasi utama">
        <div class="container">
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="mahasiswa.html">Profil Mahasiswa</a></li>
                <li><a href="form-mahasiswa.html" aria-current="page">Form Mahasiswa</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Form Data Mahasiswa</h1>
        <form action="#" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input type="text" id="nim" name="nim"
                           minlength="8" maxlength="15"
                           aria-describedby="nim-hint" required>
                    <small id="nim-hint" class="hint">8-15 karakter.</small>
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama"
                           minlength="3" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="prodi">Program Studi</label>
                    <select id="prodi" name="prodi" required>
                        <option value="">-- Pilih --</option>
                        <option value="TI">Teknik Informatika</option>
                        <option value="SI">Sistem Informasi</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="angkatan">Angkatan</label>
                <input type="number" id="angkatan" name="angkatan"
                       min="2020" max="2030" required>
            </div>
            <fieldset>
                <legend>Status Akademik</legend>
                <div class="radio-option">
                    <input type="radio" id="aktif" name="status"
                           value="aktif" checked>
                    <label for="aktif">Aktif</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="nonaktif" name="status"
                           value="nonaktif">
                    <label for="nonaktif">Nonaktif</label>
                </div>
            </fieldset>
            <div class="button-group">
                <button type="submit">Simpan</button>
                <button type="reset" class="btn-secondary">Reset</button>
            </div>
        </form>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SIKA</p>
        </div>
    </footer>
</body>
</html>
